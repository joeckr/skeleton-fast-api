name: Run Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    permissions:
      contents: read
      pull-requests: write  # Required to post coverage comments
    uses: joeckr/ci-templates/.github/workflows/pytest.yml@db877801751041f06adcca7e4b9b3a1973ac563e  # v1.21.0
    with:
      python-version: '3.14'
      working-directory: 'src'
      enable-uv: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
