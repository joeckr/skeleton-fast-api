name: Run Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    permissions:
      contents: read
      pull-requests: write  # Required to post coverage comments
    uses: joeckr/ci-templates/.github/workflows/pytest.yml@1c6283577ea8eabcda150cb4f2a9749b3c610b1d  # v1.24.1
    with:
      python-version: '3.14'
      working-directory: 'src'
      enable-uv: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
