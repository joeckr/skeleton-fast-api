name: Run Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    permissions:
      contents: read
      pull-requests: write  # Required to post coverage comments
    uses: joeckr/ci-templates/.github/workflows/pytest.yml@578d91388a3f7862fb51c4d2e685586a4d7d1daf  # v1.20.3
    with:
      python-version: '3.14'
      working-directory: 'src'
      enable-uv: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
