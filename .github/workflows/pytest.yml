name: Run Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    permissions:
      contents: read
      pull-requests: write  # Required to post coverage comments
    uses: joeckr/ci-templates/.github/workflows/pytest.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
    with:
      python-version: '3.14'
      working-directory: 'src'
      enable-uv: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
