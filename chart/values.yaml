template:
  app: fast-api
  image: ghcr.io/joeckr/skeleton-fast-api
  name: fast-api
  env:
    - name: APP_NAME
      value: "fast-api"
    - name: APP_ENV
      value: "prod"
    - name: DEBUG
      value: "false"
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8000"
    - name: ALLOWED_ORIGINS
      value: '["*"]'
    - name: LOG_LEVEL
      value: "INFO"
    - name: LOG_MODE
      value: "none"
    - name: AUTH_MODE
      value: "none"
    - name: CRON_ENABLED
      value: "true"
    - name: CRON_HEARTBEAT_INTERVAL
      value: "60"
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  port: 8000
  pullPolicy: Always
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  tag: latest
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

service:
  name: fast-api
  port: 8000
